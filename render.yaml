services:
  - type: web
    name: shuka-marketplace
    env: node
    plan: free
    buildCommand: npm run build && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: shuka-disk
      mountPath: /opt/render/project/src/data
      sizeGB: 1
